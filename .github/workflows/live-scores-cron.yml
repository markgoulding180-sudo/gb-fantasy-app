name: Live Scores Update

on:
  schedule:
    # Run every 30 seconds during Premier League match hours
    # Using multiple cron entries to approximate 30-second intervals
    - cron: '*/1 * * * *'  # Every minute
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-live-scores:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Live Scores Update
        run: |
          curl -s -X GET "https://gb-fantasy.vercel.app/api/live-scores" \
            -H "Content-Type: application/json"
        env:
          VERCEL_SITE_URL: ${{ secrets.VERCEL_SITE_URL }}
