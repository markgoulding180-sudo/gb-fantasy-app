name: Live Scores Update

on:
  schedule:
    # Run every minute during all hours (simplified for reliability)
    - cron: '* * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-live-scores:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Live Scores Update
        run: |
          curl -s -X GET "https://gb-fantasy.vercel.app/api/live-scores" \
            -H "Content-Type: application/json" || echo "Retrying..."
          
          # Second call for 30-second approximation
          sleep 30
          curl -s -X GET "https://gb-fantasy.vercel.app/api/live-scores" \
            -H "Content-Type: application/json" || echo "Done"
